spring.application.name=balo-shop-api
spring.config.import=optional:file:./.env[.properties]
server.port=8082
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${SHOP_DB_URL:jdbc:h2:file:./data/baloshop;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SHOP_DB_USERNAME:sa}
spring.datasource.password=${SHOP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${SHOP_DB_H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Enable only for the one-time H2-to-MySQL copy described in README.md.
shop.database.migrate-from-h2=${SHOP_DB_MIGRATE_FROM_H2:false}
shop.database.migration.source-url=${SHOP_DB_MIGRATION_SOURCE_URL:jdbc:h2:file:./data/baloshop;DB_CLOSE_ON_EXIT=FALSE}
shop.database.migration.source-username=${SHOP_DB_MIGRATION_SOURCE_USERNAME:sa}
shop.database.migration.source-password=${SHOP_DB_MIGRATION_SOURCE_PASSWORD:}

# Configure these values before accepting bank transfers.
shop.payment.bank-name=${SHOP_PAYMENT_BANK_NAME:}
shop.payment.account-number=${SHOP_PAYMENT_ACCOUNT_NUMBER:}
shop.payment.account-holder=${SHOP_PAYMENT_ACCOUNT_HOLDER:}

# Set both variables to create or promote the initial administrator account.
shop.admin.email=${SHOP_ADMIN_EMAIL:}
shop.admin.password=${SHOP_ADMIN_PASSWORD:}
shop.admin.full-name=${SHOP_ADMIN_FULL_NAME:Quản trị cửa hàng}
